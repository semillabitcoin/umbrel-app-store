manifestVersion: 1
id: semillabitcoin-frigate
category: bitcoin
name: Frigate
version: "1.6.1-1"
tagline: Silent Payments Electrum server for Sparrow Wallet
description: >-
  Frigate is an experimental Electrum-style server that enables Silent Payments
  (BIP352) scanning for light clients like Sparrow Wallet.


  It connects to your Bitcoin Node and builds a local tweak index using DuckDB,
  then exposes Electrum-compatible methods for Silent Payments wallets to
  subscribe and scan for incoming transactions without downloading gigabytes of
  block filter data.


  Built by sparrowwallet (Craig Raw). Requires the Bitcoin Node app to be
  installed and synced. Initial indexing can take hours on mainnet (CPU-only)
  but is fast on signet/testnet.
releaseNotes: >-
  Bump Frigate to upstream 1.6.1. 1.6.0 adds a [limits] config section
  to protect public servers (connection caps, session timeout, request
  and batch bounds, subscription limits, subscribe pacing), a
  per-session backend supervisor that reconnects with backoff and
  restores subscriptions with catch-up, TLS backend authentication and
  hot TLS certificate reload, graceful shutdown with drain, and a
  loopback admin endpoint. Upgrades DuckDB to v1.5.5 with the ufsecp
  v4.6.2 extension and OpenCL binary caching. Fixes mempool update
  failures when a spent transaction has left the mempool and a CPU
  historical scan issue after restart. 1.6.1 fixes a shutdown deadlock
  by stopping bitcoind polling before closing indexes.
